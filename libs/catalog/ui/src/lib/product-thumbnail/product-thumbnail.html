@if (showImage()) {
<img
  [ngSrc]="product().thumbnail"
  [alt]="product().title"
  [width]="size()"
  [height]="size()"
  (error)="onLoadError()"
/>
} @else {
<svg role="img" [attr.aria-label]="product().title" [attr.width]="size()" [attr.height]="size()">
  <rect width="100%" height="100%" />
</svg>
}
