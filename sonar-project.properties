sonar.projectKey=ngsample
sonar.projectName=ngsample
sonar.host.url=http://localhost:9001

sonar.sources=src,libs
sonar.tests=src,libs,e2e/src
sonar.test.inclusions=**/*.spec.ts,e2e/src/**/*
sonar.exclusions=**/*.spec.ts,libs/*/testing/**

# lcov from the unit tests and the e2e tests (`pnpm coverage`); Sonar combines them.
sonar.javascript.lcov.reportPaths=coverage/**/lcov.info
sonar.coverage.exclusions=**/index.ts,**/test-setup.ts

# The per-lib Vite/Vitest configs are generated and near-identical by design.
sonar.cpd.exclusions=**/vite.config.mts,**/vitest.config.mts

# False positives:
# - Tailwind's `@utility` blocks nest `&` and declarations, which plain-CSS rules
#   don't recognize.
# - Angular Material's <mat-label> labels the matInput at runtime; axe checks the
#   rendered labels in e2e/src/accessibility.spec.ts.
# - VoiceOver with Safari stays silent when content first appears in an <output>
#   unless it has an explicit role="status" (docs/accessibility/voiceover-script.md, 3.3).
sonar.issue.ignore.multicriteria=tw1,tw2,label,status
sonar.issue.ignore.multicriteria.tw1.ruleKey=css:S8776
sonar.issue.ignore.multicriteria.tw1.resourceKey=src/styles/tailwind.css
sonar.issue.ignore.multicriteria.tw2.ruleKey=css:S8767
sonar.issue.ignore.multicriteria.tw2.resourceKey=src/styles/tailwind.css
sonar.issue.ignore.multicriteria.label.ruleKey=Web:InputWithoutLabelCheck
sonar.issue.ignore.multicriteria.label.resourceKey=libs/**/*.html
sonar.issue.ignore.multicriteria.status.ruleKey=Web:S6822
sonar.issue.ignore.multicriteria.status.resourceKey=libs/catalog/ui/src/lib/product-detail/product-detail.html
